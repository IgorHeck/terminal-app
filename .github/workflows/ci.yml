name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

jobs:
  # ----------------------------------------------------------------
  # Lint + testes unitários (rápido, sem Electron)
  # ----------------------------------------------------------------
  unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ----------------------------------------------------------------
  # Testes E2E — roda apenas no push para development (não em PRs,
  # pois precisa do app compilado com node-pty nativo).
  # ----------------------------------------------------------------
  e2e:
    name: E2E Tests (Electron)
    runs-on: windows-latest
    # Só roda no push direto para development (após merge aprovado).
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native modules
        run: npm run rebuild

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
